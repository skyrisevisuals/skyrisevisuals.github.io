name: Build Photo Gallery

on:
  push:
    paths:
      - "images/portfolio/**"

permissions:
  contents: write


jobs:

  build-gallery:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Create photo list
      run: |

        echo "[" > photos.json

        find images/portfolio -type f \
        \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
        | sed 's|images/portfolio/||' \
        | awk '{print "\"" $0 "\","}' >> photos.json

        sed -i '$ s/,$//' photos.json

        echo "]" >> photos.json



    - name: Commit gallery
      run: |

        git config user.name "github-actions"

        git config user.email "github-actions@github.com"

        git add photos.json

        git commit -m "Update photo gallery" || exit 0

        git push
