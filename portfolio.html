<!DOCTYPE html>

<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRise Visuals | Portfolio</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="portfolio.css">


</head>



<body>



<!-- ================= HEADER ================= -->


<header>


<div class="logo">

SKYRISE <span>VISUALS</span>

</div>



<nav>

<a href="index.html">

Home

</a>

</nav>


</header>









<!-- ================= PORTFOLIO ================= -->


<section class="portfolio-page">



<h1>

Portfolio

</h1>




<div class="photo-grid" id="gallery">

</div>



</section>









<!-- ================= AUTOMATIC GALLERY ================= -->


<script>


fetch("photos.json")


.then(response => response.json())


.then(photos => {



const gallery = document.getElementById("gallery");



photos.forEach(photo => {



gallery.innerHTML += `


<div class="photo-card">



<img

src="images/portfolio/${photo}"

alt="SkyRise Visuals Photography">





<a

class="download-btn"

href="images/portfolio/${photo}"

download>


Download


</a>



</div>


`;



});


})



.catch(error => {


console.error("Gallery loading error:", error);


});



</script>





</body>


</html>
