<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkyRise Visuals | Portfolio</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="portfolio.css">

</head>


<body>


<!-- ================= HEADER ================= -->


<header>


<div class="logo">

SKYRISE <span>VISUALS</span>

</div>



<nav>


<a href="index.html">
Home
</a>


<a href="contact.html">
Contact
</a>


</nav>


</header>






<!-- ================= PORTFOLIO ================= -->


<section class="portfolio-page">


<h1 class="hidden">

Portfolio

</h1>



<div class="photo-grid" id="gallery">


</div>



</section>







<!-- ================= AUTOMATIC PHOTO GALLERY ================= -->


<script>


const gallery = document.getElementById("gallery");



// Scroll animation

const observer = new IntersectionObserver((entries)=>{


entries.forEach(entry=>{


if(entry.isIntersecting){


entry.target.classList.add("show");


observer.unobserve(entry.target);


}


});


},{

threshold:.15

});





// Load photos automatically


fetch("photos.json")


.then(response => {


if(!response.ok){

throw new Error("photos.json not found");

}


return response.json();


})


.then(photos => {



photos.forEach((photo,index)=>{



const card = document.createElement("div");


card.className = "photo-card";



card.innerHTML = `


<img

src="images/portfolio/${photo}"

alt="SkyRise Visuals Photography"

loading="lazy"

onerror="this.style.display='none'">


<a

class="download-btn"

href="images/portfolio/${photo}"

download>


Download


</a>


`;





gallery.appendChild(card);




// stagger animation


setTimeout(()=>{


observer.observe(card);


}, index * 80);



});



})



.catch(error=>{


console.error(

"Gallery loading error:",

error

);


});



</script>



</body>

</html>
