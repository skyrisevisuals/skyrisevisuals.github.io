<!-- ================= HEADER ================= -->

<div class="logo">

</div>

<!-- ================= PORTFOLIO ================= -->


<section class="portfolio-page">



<h1>

Portfolio

</h1>





<div class="photo-grid" id="gallery">


</div>



</section>









<!-- ================= AUTO GALLERY SCRIPT ================= -->


<script>


const photos = [


"photo1.jpg",

"photo2.jpg",

"photo3.jpg",

"photo4.jpg",

"photo5.jpg",

"photo6.jpg",

"photo7.jpg",

"photo8.jpg",


];




const gallery = document.getElementById("gallery");





photos.forEach(photo => {



gallery.innerHTML += `


<div class="photo-card">



<img 

src="images/portfolio/${photo}"

alt="SkyRise Visuals Photography">





<a 

class="download-btn"

href="images/portfolio/${photo}"

download>



Download



</a>



</div>



`;



});



</script>
