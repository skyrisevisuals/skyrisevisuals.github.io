name: SkyRise Visuals Website Check

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  website-check:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Website
      uses: actions/checkout@v5


    - name: Verify Website Files
      run: |

        echo "Checking SkyRise Visuals files..."

        test -f index.html
        test -f style.css
        test -f script.js
        test -f photos.json

        echo "All required files found."


    - name: List Website Structure
      run: |

        echo "Website files:"
        ls -la

        echo "Images:"
        ls -la images/portfolio || true


    - name: Website Check Complete
      run: |

        echo "SkyRise Visuals build check passed."
